<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2550"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f95ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7f95ff" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- sol en perspective -->
  <g stroke="url(#floor)" stroke-width="3" fill="none">
    <path d="M128 150 L20 236 M128 150 L74 236 M128 150 L128 236 M128 150 L182 236 M128 150 L236 236"/>
    <path d="M70 196 H186 M44 218 H212"/>
  </g>
  <!-- cube de rangement en fil de fer -->
  <g fill="none" stroke="#8fe3ff" stroke-width="5" stroke-linejoin="round">
    <path d="M86 70 L150 52 L196 76 L132 96 Z" fill="#5ad1ff" fill-opacity=".12"/>
    <path d="M86 70 V140 L132 166 V96"/>
    <path d="M196 76 V146 L132 166"/>
  </g>
  <!-- icônes en profondeur -->
  <rect x="104" y="104" width="22" height="22" rx="5" fill="#f5c04a"/>
  <rect x="146" y="112" width="20" height="20" rx="5" fill="#ff7ab6"/>
  <rect x="164" y="88" width="16" height="16" rx="4" fill="#8cf08c"/>
  <!-- icônes hors du cube, avec leur tige vers le sol -->
  <g stroke="#ffffff" stroke-opacity=".5" stroke-width="3">
    <line x1="48" y1="122" x2="48" y2="196"/>
    <line x1="214" y1="128" x2="214" y2="200"/>
  </g>
  <rect x="34" y="96" width="28" height="28" rx="7" fill="#5ad1ff"/>
  <rect x="202" y="108" width="24" height="24" rx="6" fill="#b48cff"/>
  <ellipse cx="48" cy="198" rx="14" ry="4" fill="#5ad1ff" fill-opacity=".5"/>
  <ellipse cx="214" cy="202" rx="12" ry="3.5" fill="#b48cff" fill-opacity=".5"/>
</svg>
